# 实验配置示例。所有键都必须写进 config_hash；除被测项外禁止改动。
experiment:
  id: b2_state_structured_smoke
  description: "B2：结构化状态 vs B0 基线，小规模冒烟"
  seed: 20261110
  session_mode: stateless         # stateless | server_side

method:
  name: baseline@v1
  frontier: uct                   # uct | best_first | linear
  scorer: hybrid                  # hybrid | delta_facts | info_gain
  controller: budget_stop         # budget_stop | threshold | fixed_turns
  assembler: fact_list_k          # raw_concat | fact_list | fact_list_k
  k_candidates: 3

state:
  backend: structured             # raw_history | summary | structured
  extractor_version: x1
  fidelity_warn_ratio: 0.2        # inferred 占比超此值告警
  max_facts: 12

memory:
  enabled: false                  # 跨 episode 记忆默认关闭
  scope: episode                  # episode | experiment | global
  max_items: 50

target:
  provider: openai_compatible
  model: TARGET_MODEL
  temperature: 0.7
  defenses: []                    # 例如 [input_filter, rephrase]

judge:
  online:
    id: rule_v1                   # 便宜、确定性高
  eval:
    primary: JUDGE_MODEL_A
    secondary: JUDGE_MODEL_B
    rubric: sr.v1

budget:
  target_calls: 20
  judge_calls: 6
  tokens: 200000
  wall_ms: 600000

dataset:
  name: strongreject
  subset: first_100
  rubric_version: sr.v1

reporting:
  cost_breakdown: [target, judge, assemble, extract]
  paired_against: b0
  primary_metric: asr_at_budget
