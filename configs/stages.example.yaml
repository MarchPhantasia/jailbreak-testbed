# 阶段配置（手册 §8.1）。只映射服务已支持的控制项；未支持项如实记录为 unknown。
stages:
  ref: stages@v1
  common:
    temperature: 0.7
    max_tokens: 1024
  stage_map:
    locate:
      max_tokens: 256
    plan:
      max_tokens: 1024
    extract:
      max_tokens: 512
    assemble:
      max_tokens: 2048
    select:
      max_tokens: 128
    judge_online:
      temperature: 0.0
      max_tokens: 256
    judge_eval:
      temperature: 0.0
      max_tokens: 512
  inheritance:
    locate: common
    plan: common
    extract: locate
  unsupported:
    thinking_budget: unknown
