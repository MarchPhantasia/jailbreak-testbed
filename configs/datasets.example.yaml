# 数据来源（手册 §14）。只读固定版本；规范化仅用于比较。
datasets:
  strongreject:
    adapter: strongreject
    path: data/raw/strongreject.jsonl
    revision: pinned
    include_types: [text]
  harmbench:
    adapter: harmbench
    path: data/raw/harmbench_text.csv
    revision: pinned
    include_types: [standard, contextual]
  synthetic_library:
    adapter: synthetic_library
    path: fixtures/synthetic_library/tasks.jsonl
    revision: v1
split:
  seed: 20261110
  dev_ratio: 2
  policy: text_holdout_v1
