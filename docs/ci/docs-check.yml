# 待启用：当前 token 缺少 workflow 权限，无法推送 .github/workflows/ 下的文件。
# 具备权限后执行：git mv docs/ci/docs-check.yml .github/workflows/docs-check.yml
# （fine-grained token 需勾选 Workflows: Read and write；classic token 需 workflow scope）
name: docs-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装可选依赖
        run: pip install pyyaml || true
      - name: 运行 precheck
        run: bash scripts/precheck.sh
