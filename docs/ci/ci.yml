# 待启用：当前 token 缺 workflow 权限，无法推送 .github/workflows/ 下的文件。
# 补齐权限后执行：git mv docs/ci/ci.yml .github/workflows/ci.yml && git push
# （fine-grained token 勾 Workflows: Read and write；classic token 勾 workflow scope）
# 本文件取代早先的 docs/ci/docs-check.yml（后者只跑 precheck，本文件同时跑 pytest）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Docs and spec checks
        run: bash scripts/precheck.sh
